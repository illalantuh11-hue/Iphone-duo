name: iPhoneDuo
options:
  bundleIdPrefix: com.illalantuh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iPhoneDuo:
    type: application
    platform: iOS
    sources:
      - path: iPhoneDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illalantuh.iPhoneDuo
        INFOPLIST_FILE: iPhoneDuo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
